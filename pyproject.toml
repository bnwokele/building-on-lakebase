[project]
name = "agent-server"
version = "0.1.0"
description = "MLflow-compatible agent server with FastAPI"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    # ── OpenAI Agents SDK stack ─────────────────────────────────────────────────
    # The agent framework (Agent/Runner/function_tool) and the Databricks bridge that routes it at
    # model serving (AsyncDatabricksOpenAI). Based on the agent-openai-agents-sdk template.
    "openai-agents>=0.4.1",
    "databricks-openai>=0.13.0",
    # Managed sessions + memory — the Databricks AgentKit SDK. The `[openai]` extra ships the
    # Agents-SDK adapter `databricks_agentkit.openai.session_store` (a SessionABC) + `memory_tools`,
    # used by agent_server/managed.py.
    "databricks-agentbricks[openai]>=0.3.0",
    # LakebasePool (databricks_ai_bridge.lakebase) for the operational db.py + hybrid search.
    # AgentKit (databricks-agentbricks) requires databricks-ai-bridge[memory]>=0.22.0 anyway.
    "databricks-ai-bridge[memory]>=0.22.0",
    # sdk>=0.106 has the autoscaling `postgres` API used by the deploy scripts + LakebaseClient grant.
    "databricks-sdk>=0.106.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.1",
    # Pin pyarrow (pulled in by mlflow) below 25: the 25.x wheel is large and can time out during
    # the Databricks App build on some package mirrors; <25 installs reliably.
    "pyarrow>=17.0.0,<25",
    "python-dotenv>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "psycopg[binary,pool]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

setup = [
    "ruamel.yaml>=0.18.0",
]

[tool.uv]
default-groups = ["dev", "setup"]


[tool.pytest.ini_options]
base_url = "http://localhost:8000"
addopts = "-n 7"

[project.scripts]
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
preflight = "scripts.preflight:main"
