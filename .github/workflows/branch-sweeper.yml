# Safety net: delete ci-pr-* Lakebase branches whose PR is no longer open (e.g. a cancelled
# cleanup run). Branch TTLs cover the rest.
name: Lakebase branch sweeper

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  LAKEBASE_AUTOSCALING_PROJECT: ${{ vars.LAKEBASE_AUTOSCALING_PROJECT }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sweep:
    # Set repo variable RUNNER=self-hosted if your workspace has an IP allowlist (GitHub-hosted
    # runner IPs would be blocked); otherwise GitHub's runners are used.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners use the machine's own uv (and its cache), so skip the install.
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'github-hosted'
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - name: Delete branches of closed PRs
        run: |
          OPEN=$(gh pr list --repo "${{ github.repository }}" --state open --json number --jq '.[].number')
          uv run python scripts/branch.py sweep --keep $OPEN
