# Tear down the PR's Lakebase branch when the PR closes — merged or not — so nothing is left
# behind. (The branch also has a TTL, and branch-sweeper.yml catches anything missed.)
name: PR database cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  LAKEBASE_AUTOSCALING_PROJECT: ${{ vars.LAKEBASE_AUTOSCALING_PROJECT }}

jobs:
  delete-branch:
    # Never run fork PRs: they'd get a database branch and (on a self-hosted runner) your machine.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Set repo variable RUNNER=self-hosted if your workspace has an IP allowlist (GitHub-hosted
    # runner IPs would be blocked); otherwise GitHub's runners are used.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners use the machine's own uv (and its cache), so skip the install.
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'github-hosted'
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - name: Delete Lakebase branch
        run: uv run python scripts/branch.py delete "ci-pr-${{ github.event.number }}"
